version: "3.9"

services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root0
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  # Optional: local mail testing service (useful for Day 2 + Mailpit integration)
  # mailpit:
  #   image: axllent/mailpit:latest
  #   ports:
  #     - "8025:8025"
  #     - "1025:1025"

volumes:
  db-data:
